# ---------------------------------------------------------------------------
# AI-ready metadata — events_silver (silver layer)
# ---------------------------------------------------------------------------

table:
  name: events_silver
  layer: silver
  description: >
    Cleansed adverse event report data. Raw YYYYMMDD dates parsed to DATE type,
    patient sex and reporter qualification mapped to human-readable labels,
    seriousness flags decomposed into boolean columns and a single
    seriousness_category field. Patient age and weight cast to numeric.
  grain: one row per safety report (safetyreportid)
  owner: TODO(pharmacovigilance-team)
  source_system: Cleansed from events_bronze — date parsing, code-to-label mapping, derived columns
  ingestion_method: Spark Declarative Pipeline silver_transform — reads events_bronze via cross-pipeline spark.table()
  refresh_frequency: on every pipeline run
  tags:
    layer: silver
    source_system: openfda
    owner: TODO(pharmacovigilance-team)
    refresh_frequency: per_run
    pii_contains: "false"
  properties:
    medallion.layer: silver
    medallion.source: openfda
    medallion.metadata_version: "1.0"
  primary_key: [safetyreportid]
  foreign_keys: []
  quality_rules:
    - "safetyreportid is not null (SDP expectation)"
    - "receive_date is not null (SDP expectation)"

columns:
  safetyreportid:
    description: Unique safety report identifier. Primary key, joins to drugs_silver and reactions_silver.
    unit: null
    examples: ["US-FDA-00000001"]
    pii: false
    semantic_type: identifier
    ai_role: key
  receive_date:
    description: Date the report was received by FDA, parsed from YYYYMMDD string to DATE type.
    unit: null
    examples: ["2023-01-15", "2024-06-20"]
    pii: false
    semantic_type: timestamp
    ai_role: feature
  receipt_date:
    description: Date of receipt acknowledgment, parsed from YYYYMMDD to DATE.
    unit: null
    examples: ["2023-01-20"]
    pii: false
    semantic_type: timestamp
    ai_role: exclude
  transmission_date:
    description: Date the report was transmitted, parsed from YYYYMMDD to DATE.
    unit: null
    examples: ["2023-01-16"]
    pii: false
    semantic_type: timestamp
    ai_role: exclude
  occurcountry:
    description: ISO country code where the adverse event occurred. US dominates at ~30%.
    unit: null
    examples: ["US", "GB", "DE"]
    pii: false
    semantic_type: dimension
    ai_role: feature
  reporter_type:
    description: Human-readable reporter qualification. Physician, Pharmacist, Other Health Professional, Lawyer, Consumer, or Unknown.
    unit: null
    examples: ["Physician", "Consumer"]
    pii: false
    semantic_type: dimension
    ai_role: feature
  reportercountry:
    description: ISO country code of the reporter.
    unit: null
    examples: ["US", "GB"]
    pii: false
    semantic_type: dimension
    ai_role: exclude
  reporttype:
    description: Report type code. 1=Spontaneous, 2=Study, 3=Other.
    unit: null
    examples: ["1", "3"]
    pii: false
    semantic_type: dimension
    ai_role: exclude
  serious:
    description: Raw seriousness code from bronze. 1=Serious, 2=Non-Serious.
    unit: null
    examples: ["1", "2"]
    pii: false
    semantic_type: dimension
    ai_role: exclude
  serious_label:
    description: Human-readable seriousness label derived from serious code. Serious or Non-Serious.
    unit: null
    examples: ["Serious", "Non-Serious"]
    pii: false
    semantic_type: dimension
    ai_role: label
  seriousness_category:
    description: Primary seriousness category. Death, Life-Threatening, Hospitalization, Disabling, Congenital Anomaly, Other Serious, or Non-Serious. Derived from first non-empty seriousness flag.
    unit: null
    examples: ["Hospitalization", "Death", "Non-Serious"]
    pii: false
    semantic_type: dimension
    ai_role: label
  is_fatal:
    description: Boolean — true if the event resulted in death (seriousnessdeath=1).
    unit: null
    examples: [true, false]
    pii: false
    semantic_type: measure
    ai_role: feature
  is_hospitalized:
    description: Boolean — true if hospitalization was required (seriousnesshospitalization=1).
    unit: null
    examples: [true, false]
    pii: false
    semantic_type: measure
    ai_role: feature
  is_life_threatening:
    description: Boolean — true if the event was life-threatening (seriousnesslifethreatening=1).
    unit: null
    examples: [true, false]
    pii: false
    semantic_type: measure
    ai_role: feature
  is_disabling:
    description: Boolean — true if the event was disabling (seriousnessdisabling=1).
    unit: null
    examples: [true, false]
    pii: false
    semantic_type: measure
    ai_role: feature
  patient_age:
    description: Patient age at time of event, cast to integer. Range 1-95.
    unit: years
    examples: [45, 72]
    pii: false
    semantic_type: measure
    ai_role: feature
  patient_weight_kg:
    description: Patient weight in kilograms, cast to double. NULL for ~15% of reports.
    unit: kg
    examples: [70.5, 85.0]
    pii: false
    semantic_type: measure
    ai_role: feature
  sex_label:
    description: Human-readable patient sex. Male, Female, or Unknown.
    unit: null
    examples: ["Male", "Female", "Unknown"]
    pii: false
    semantic_type: dimension
    ai_role: feature
